fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=700"]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-symlinks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
      - id: ruff-format
      - id: ruff
        args:
          - --no-fix
        stages:
          - manual
      - id: ruff-format
        args:
          - --check
        stages:
          - manual

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        pass_filenames: false
        args:
          - --install-types
          - --non-interactive

  # The admin UI, with the tools pinned in fsrc: run `npm install` there first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: fsrc/node_modules/.bin/prettier --write --ignore-unknown
        language: system
        files: ^fsrc/
        exclude: ^fsrc/package-lock\.json$
        types: [text]
      - id: eslint
        name: eslint
        entry: fsrc/node_modules/.bin/eslint --fix
        language: system
        files: ^fsrc/
        types_or: [javascript, jsx, ts, tsx]
      - id: tsc
        name: tsc
        entry: npm --prefix fsrc run typecheck
        language: system
        files: ^fsrc/
        types_or: [ts, tsx]
        pass_filenames: false
