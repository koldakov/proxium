name: Test

on:
  # main runs it from release.yml, before publishing the image.
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: >-
          uv
          sync
          --locked

      # The admin UI hooks in pre-commit use tools from fsrc/node_modules.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fsrc/package-lock.json

      - name: Install admin UI dependencies
        run: >-
          npm
          ci
          --prefix fsrc

      - name: Run pre-commit
        run: >-
          uv
          run
          pre-commit
          run
          --all-files
          --show-diff-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: >-
          uv
          sync
          --locked

      - name: Run unit tests
        run: >-
          uv
          run
          pytest
          tests/unit
