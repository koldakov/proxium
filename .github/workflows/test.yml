name: Test

on:
  # main runs it from release.yml, before publishing the image.
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: >-
          uv
          sync
          --locked

      # The admin UI hooks in pre-commit use tools from fsrc/node_modules.
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fsrc/package-lock.json

      - name: Install admin UI dependencies
        run: >-
          npm
          ci
          --prefix fsrc

      - name: Run pre-commit
        run: >-
          uv
          run
          pre-commit
          run
          --all-files
          --show-diff-on-failure

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: >-
          uv
          sync
          --locked

      - name: Run unit tests
        # Own data file: the coverage job combines it with the acceptance one.
        env:
          COVERAGE_FILE: .coverage.unit
        run: >-
          uv
          run
          pytest
          tests/unit

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: .coverage.unit
          # Dotfiles are skipped by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  acceptance-tests:
    name: Acceptance tests
    # Slower and need a database: only once unit tests pass.
    needs: unit-tests
    runs-on: ubuntu-latest
    # The tests create and drop their own database on it, test_proxium, see tests/database.py.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proxium
          POSTGRES_PASSWORD: proxium
          POSTGRES_DB: proxium
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://proxium:proxium@localhost:5432/proxium
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: >-
          uv
          sync
          --locked

      - name: Run acceptance tests
        env:
          COVERAGE_FILE: .coverage.acceptance
        run: >-
          uv
          run
          pytest
          tests/acceptance

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-acceptance
          path: .coverage.acceptance
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    needs:
      - unit-tests
      - acceptance-tests
    runs-on: ubuntu-latest
    steps:
      # The report reads the source files.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: >-
          uv
          sync
          --locked

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Combine coverage
        run: >-
          uv
          run
          coverage
          combine

      - name: Report coverage
        run: |
          uv run coverage report
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
