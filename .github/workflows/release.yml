name: Release
run-name: Publish release ${{ github.event.release.tag_name }}

# A published release → its version, major.minor and latest. Pushes to main go to edge, see edge.yml.
on:
  release:
    types:
      - published

# Read-only by default, publish adds what it needs.
permissions:
  contents: read

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  check:
    name: Check release
    runs-on: ubuntu-latest
    steps:
      # Full history: the check below looks for the commit in main.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Check release commit is in main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA isn't in main" >&2
            exit 1
          fi

      - name: Check release tag matches project version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG doesn't match v$version from pyproject.toml" >&2
            exit 1
          fi
          admin_version=$(python3 -c "import json; print(json.load(open('fsrc/package.json'))['version'])")
          if [ "$admin_version" != "$version" ]; then
            echo "fsrc/package.json version $admin_version doesn't match $version from pyproject.toml" >&2
            exit 1
          fi

  publish:
    name: Publish release
    needs:
      - test
      - check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      # Pre-releases get only their version, latest stays on the last stable one. No major tag while 0.x.
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}},enable=${{ !startsWith(github.event.release.tag_name, 'v0.') }}
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
