<svg xmlns="http://www.w3.org/2000/svg" width="820" height="384" viewBox="0 0 820 384" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<style>
.card{fill:#fff;stroke:#dde3e7}.fg{fill:#16212a}.muted{fill:#5d6b76}.bar{fill:#b9c4cc}.ours{fill:#0b7a83}
.band{fill:#e3f3f4}.grid{stroke:#e8edf0}.limit{stroke:#c2410c}.limit-t{fill:#c2410c}
.line{fill:none;stroke:#b9c4cc;stroke-width:2}.line-ours{fill:none;stroke:#0b7a83;stroke-width:3}
.dot{fill:#b9c4cc;stroke:#fff;stroke-width:2}.dot-ours{fill:#0b7a83;stroke:#fff;stroke-width:2}
.pill{fill:#0b7a83}.pill-t{fill:#fff}
@media (prefers-color-scheme:dark){
.card{fill:#151f26;stroke:#26333c}.fg{fill:#e3eaee}.muted{fill:#8d9ba5}.bar{fill:#3a4852}.ours{fill:#3cc3cc}
.band{fill:#153138}.grid{stroke:#22303a}.limit{stroke:#fb923c}.limit-t{fill:#fb923c}
.line{stroke:#4a5964}.line-ours{stroke:#3cc3cc}.dot{fill:#4a5964;stroke:#151f26}.dot-ours{fill:#3cc3cc;stroke:#151f26}
.pill{fill:#3cc3cc}.pill-t{fill:#0f161b}}
</style>
<rect class="card" x="0.5" y="0.5" width="819" height="383" rx="10"/>
<text class="fg" x="24" y="38" font-size="19" font-weight="600">Fills your network. And you run it from a browser.</text>
<text class="muted" x="24" y="62" font-size="13">Downloads of 100 MB files through the proxy, 8 at a time. Longer bar is faster.</text>
<text class="muted" x="132" y="106" font-size="12" font-weight="600">Download speed, Gbit/s</text>
<text class="muted" x="606" y="106" font-size="12" font-weight="600">How you manage it</text>
<text class="fg" x="120" y="144" font-size="14" font-weight="500" text-anchor="end">3proxy 1.0.2</text>
<rect class="bar" x="132" y="128" width="387.0" height="24" rx="4"/>
<text class="fg" x="527.0" y="145" font-size="14" font-weight="500">92</text>
<text class="muted" x="620" y="145" font-size="13">Config files + reload</text>
<text class="fg" x="120" y="194" font-size="14" font-weight="500" text-anchor="end">Squid 6.13</text>
<rect class="bar" x="132" y="178" width="343.5" height="24" rx="4"/>
<text class="fg" x="483.5" y="195" font-size="14" font-weight="500">81</text>
<text class="muted" x="620" y="195" font-size="13">Config files + reload</text>
<rect class="band" x="12" y="218" width="796" height="44" rx="8"/>
<text class="fg" x="120" y="244" font-size="14" font-weight="700" text-anchor="end">Proxium</text>
<rect class="ours" x="132" y="228" width="251.4" height="24" rx="4"/>
<text class="fg" x="391.4" y="245" font-size="14" font-weight="700">60</text>
<rect class="pill" x="606" y="226" width="190" height="28" rx="14"/>
<text class="pill-t" x="701.0" y="245" font-size="13" font-weight="700" text-anchor="middle">✓ Web admin + API</text>
<text class="fg" x="120" y="294" font-size="14" font-weight="500" text-anchor="end">Dante 1.4.3</text>
<text class="muted" x="120" y="309" font-size="11" text-anchor="end">SOCKS5 only</text>
<rect class="bar" x="132" y="278" width="94.0" height="24" rx="4"/>
<text class="fg" x="234.0" y="295" font-size="14" font-weight="500">22</text>
<text class="muted" x="620" y="295" font-size="13">Config files + reload</text>
<line class="limit" x1="174.2" y1="118" x2="174.2" y2="314" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="limit-t" x="180.2" y="334" font-size="12">10 Gbit/s network card: every proxy here fills it</text>
<text class="muted" x="24" y="370" font-size="11">Apple M4, Docker Desktop, every proxy on the same 4 cores with password auth.</text>
</svg>
