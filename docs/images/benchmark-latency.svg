<svg xmlns="http://www.w3.org/2000/svg" width="820" height="408" viewBox="0 0 820 408" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<style>
.card{fill:#fff;stroke:#dde3e7}.fg{fill:#16212a}.muted{fill:#5d6b76}.bar{fill:#b9c4cc}.ours{fill:#0b7a83}
.band{fill:#e3f3f4}.grid{stroke:#e8edf0}.limit{stroke:#c2410c}.limit-t{fill:#c2410c}
.line{fill:none;stroke:#b9c4cc;stroke-width:2}.line-ours{fill:none;stroke:#0b7a83;stroke-width:3}
.dot{fill:#b9c4cc;stroke:#fff;stroke-width:2}.dot-ours{fill:#0b7a83;stroke:#fff;stroke-width:2}
.pill{fill:#0b7a83}.pill-t{fill:#fff}
@media (prefers-color-scheme:dark){
.card{fill:#151f26;stroke:#26333c}.fg{fill:#e3eaee}.muted{fill:#8d9ba5}.bar{fill:#3a4852}.ours{fill:#3cc3cc}
.band{fill:#153138}.grid{stroke:#22303a}.limit{stroke:#fb923c}.limit-t{fill:#fb923c}
.line{stroke:#4a5964}.line-ours{stroke:#3cc3cc}.dot{fill:#4a5964;stroke:#151f26}.dot-ours{fill:#3cc3cc;stroke:#151f26}
.pill{fill:#3cc3cc}.pill-t{fill:#0f161b}}
</style>
<rect class="card" x="0.5" y="0.5" width="819" height="407" rx="10"/>
<text class="fg" x="24" y="38" font-size="19" font-weight="600">Time to load a small page, ms</text>
<text class="muted" x="24" y="62" font-size="13">From connecting to the proxy to the last byte, 200 clients at once. Shorter is better.</text>
<line class="grid" x1="172.0" y1="106" x2="172.0" y2="342"/>
<text class="muted" x="172.0" y="98" font-size="11" text-anchor="middle">0 ms</text>
<line class="grid" x1="283.6" y1="106" x2="283.6" y2="342"/>
<text class="muted" x="283.6" y="98" font-size="11" text-anchor="middle">10 ms</text>
<line class="grid" x1="395.2" y1="106" x2="395.2" y2="342"/>
<text class="muted" x="395.2" y="98" font-size="11" text-anchor="middle">20 ms</text>
<line class="grid" x1="506.8" y1="106" x2="506.8" y2="342"/>
<text class="muted" x="506.8" y="98" font-size="11" text-anchor="middle">30 ms</text>
<line class="grid" x1="618.4" y1="106" x2="618.4" y2="342"/>
<text class="muted" x="618.4" y="98" font-size="11" text-anchor="middle">40 ms</text>
<line class="grid" x1="730.0" y1="106" x2="730.0" y2="342"/>
