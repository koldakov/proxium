<rect class="bar" x="329.0" y="274" width="3" height="16" rx="1.5"/>
<text class="fg" x="338.5" y="286" font-size="12">6 / 14</text>
<text class="fg" x="160" y="327" font-size="14" font-weight="500" text-anchor="end">Dante <tspan class="muted" font-weight="400" font-size="12">SOCKS5</tspan></text>
