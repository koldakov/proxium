worker_processes 1;
worker_rlimit_nofile 1048576;
error_log /dev/stderr error;

events {
    worker_connections 65536;
}

http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_requests 100000;

    server {
        listen 80 reuseport backlog=4096;
        root /usr/share/nginx/html;
    }
}
