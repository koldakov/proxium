# Dante as a production SOCKS5 server: login and password of a system user, no per-connection logging.
logoutput: stderr
internal: 0.0.0.0 port = 1080
external: eth0

socksmethod: username
clientmethod: none
# Root reads /etc/shadow to check passwords, the rest runs as nobody.
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    command: connect
    socksmethod: username
}
