# 3proxy as a production forward proxy: one process, a thread per connection, auth by login, no logging.
# Docker's embedded DNS.
nserver 127.0.0.11
nscache 65536
maxconn 20000

users bench:CL:bench
auth strong
allow bench

# -n: no NTLM, -a: anonymous, no client details passed on (like Squid's forwarded_for delete).
proxy -p3128 -n -a
socks -p1080
