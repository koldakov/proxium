# Squid as a production forward proxy: SMP workers on the 4 cores, Basic auth, no cache, logging turned down.
workers 4
http_port 3128

# Credentials cached 10s, as proxium caches accounts by default (basicAccountCacheTtl).
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 20 startup=4 idle=2
auth_param basic credentialsttl 10 seconds
auth_param basic realm proxy

acl authenticated proxy_auth REQUIRED
http_access deny !authenticated
http_access allow authenticated
http_access deny all

# A forward proxy, not a cache.
cache deny all
cache_mem 0 MB

access_log none
cache_store_log none
logfile_rotate 0
debug_options ALL,0

max_filedescriptors 1048576
via off
forwarded_for delete
